# 전역 앱 설정 예시 — 이 파일을 app_config.yaml 로 복사해 사용한다.
#
# 실제 app_config.yaml 은 .gitignore 대상이다 (SMTP 비밀번호·텔레그램 토큰 포함).
# 파일이 없으면 앱이 시작할 때 아래 기본값으로 동작하고, Settings → Config 에서
# 저장하는 순간 프로그램 폴더에 새로 생성된다.
#
# 대응 모델: pythonization/config/app_config.py 의 AppConfig

# 측정값 abs 상한선. |value| 가 이 값을 넘으면 nan 으로 기록한다.
global_threshold: 1.0e+37

# 서로 다른 계측기를 동시에 측정할지 여부 (False = 순차 측정).
parallel_measurement: false

# 사용자 데이터(프로파일·계측기·VNA·resume) 폴더.
# 빈 문자열이면 ~/Documents/pythonization/settings 를 쓴다. 변경은 재시작 후 적용.
data_dir: ''

# 알람 전송 수단 — 프로파일과 무관하게 공유되는 전역값.
# on/off·트리거 조건은 각 프로파일의 AlarmConfig 에 따로 저장된다.
alarm_delivery:
  use_sound: true

  use_email: false
  smtp_host: smtp.gmail.com
  smtp_port: 587
  smtp_user: ''
  smtp_password: ''      # ← 앱 비밀번호. 저장소에 커밋하지 말 것.
  email_to: ''

  use_telegram: false
  telegram_bot_token: '' # ← 봇 토큰. 저장소에 커밋하지 말 것.
  telegram_chat_id: ''
  telegram_contacts: []
