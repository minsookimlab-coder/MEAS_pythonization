[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pythonization"
version = "1.8.0"
description = "저온·자기장 물성 측정 자동화 (PySide6 + VISA)"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "pyqtgraph>=0.13",
    "numpy>=1.24",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "PyVISA>=1.13",
    "PyVISA-py>=0.7",
]

[project.optional-dependencies]
# Zurich MFLI 측정 모듈. 없으면 MFLI 창 연결 시 안내만 뜨고 나머지는 정상.
mfli = ["zhinst>=23.0"]
# 미분 채널 Savitzky-Golay 필터. 없으면 다항식 회귀로 자동 fallback.
savgol = ["scipy>=1.10"]
build = ["pyinstaller>=6.0"]

[project.scripts]
pythonization = "pythonization.app.bootstrap:main"

[tool.setuptools.packages.find]
include = ["pythonization*"]

[tool.setuptools.package-data]
"pythonization.ui.assets" = ["*.png"]

# 테스트는 표준 라이브러리 unittest 로 작성되어 별도 설치 없이 돌아간다.
#   python -m unittest discover -s tests -t .
# pytest 가 있으면 `pytest tests` 로도 그대로 실행된다.
[tool.pytest.ini_options]
testpaths = ["tests"]
