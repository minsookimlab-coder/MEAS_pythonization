main_ui:
  sweep_values:
  - alias: 2636A
    description: write_smua_voltage
    cmd_set: smua.source.levelv={v}
    paired_read_cmd: reading=smua.measure.v()print(reading)
    figure_axis: target_smua_voltage
    unit: V
    safety_steps: 5
    safety_interval_ms: 1.0
    fill_params:
      v: '[SWEEP]'
  - alias: 2636A
    description: write_smub_voltage
    cmd_set: smub.source.levelv={v}
    paired_read_cmd: reading=smub.measure.i()print(reading)
    figure_axis: target_smub_voltage
    unit: V
    safety_steps: 5
    safety_interval_ms: 1.0
    fill_params:
      v: '[SWEEP]'
  measurements:
  - alias: 2636A
    description: read_smua_current
    resolved_cmd: print(smua.measure.i())
    figure_axis: smua_current
    unit: A
    fill_params: {}
    axis_suffix: ''
    meas_type: none
    checked: true
  - alias: 2636A
    description: read_smub_current
    resolved_cmd: print(smub.measure.i())
    figure_axis: smub_current
    unit: A
    fill_params: {}
    axis_suffix: ''
    meas_type: none
    checked: false
