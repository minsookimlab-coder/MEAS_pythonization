2636A:
  measurements:
  - description: read_smua_current
    cmd_query: print(smua.measure.i())
    figure_axis: smua_current
    unit: A
  - description: read_smub_current
    cmd_query: print(smub.measure.i())
    figure_axis: smub_current
    unit: A
  - description: read_smua_voltage
    cmd_query: print(smua.measure.v())
    figure_axis: smua_voltage
    unit: V
  - description: read_smub_voltage
    cmd_query: print(smub.measure.i())
    figure_axis: smub_voltage
    unit: V
  sweep_values:
  - description: write_smua_voltage
    cmd_set: smua.source.levelv={v}
    paired_read_cmd: print(smua.measure.v())
    figure_axis: target_smua_voltage
    unit: V
  - description: write_smub_voltage
    cmd_set: smub.source.levelv={v}
    paired_read_cmd: print(smub.measure.i())
    figure_axis: target_smub_voltage
    unit: V
  write_cmds: []
M81:
  measurements:
  - description: read_M81_Modul3_current
    cmd_query: :SOURce3:CURRent:OFFSet?
    figure_axis: M81_M3_offsetcurrent
    unit: A
  - description: read_M81_Modul3_voltage
    cmd_query: :SOURce3:VOLTage:OFFSet?
    figure_axis: M81_M3_offsetvoltage
    unit: V
  - description: read_M81_Modul{M}_voltage_ip
    cmd_query: :FETCh:SENSe{M}:LIA:X?
    figure_axis: M81_M{M}_voltage_ip
    unit: V
  - description: read_M81_Modul{M}_voltage_oop
    cmd_query: :FETCh:SENSe{M}:LIA:Y?
    figure_axis: M81_M{M}_voltage_oop
    unit: V
  - description: read_M81_Modul{M}_DC_voltage
    cmd_query: :FETCh:SENSe{M}:LIA:DC?
    figure_axis: M81_M{M}_DC_voltage
    unit: V
  sweep_values: []
  write_cmds: []
ITC:
  measurements:
  - description: read_ITC_VTI_temperature
    cmd_query: READ:DEV:MB1.T1:TEMP:SIG:TEMP
    figure_axis: VTI_TEMP
    unit: K
  - description: read_ITC_probe_temperature
    cmd_query: READ:DEV:DB8.T1:TEMP:SIG:TEMP
    figure_axis: probe_TEMP
    unit: K
  sweep_values: []
  write_cmds: []
IPS:
  measurements:
  - description: read_IPS_z_magnetic_field
    cmd_query: READ:DEV:GRPZ:PSU:SIG:FLD
    figure_axis: B
    unit: T
  - description: read_IPS_MB1_temperature
    cmd_query: READ:DEV:MB1.T1:TEMP:SIG:TEMP
    figure_axis: MB1_TEMP
    unit: K
  - description: read_IPS_PT1_temperature
    cmd_query: READ:DEV:DB8.T1:TEMP:SIG:TEMP
    figure_axis: PT1_TEMP
    unit: K
  - description: read_IPS_PT2_temperature
    cmd_query: READ:DEV:DB7.T1:TEMP:SIG:TEMP
    figure_axis: PT2_TEMP
    unit: K
  sweep_values: []
  write_cmds: []
SIGGEN:
  measurements: []
  sweep_values: []
  write_cmds: []
SR830:
  measurements:
  - description: read_SR830_voltage_ip
    cmd_query: OUTR?1
    figure_axis: SR830_voltage_ip
    unit: V
  - description: read_SR830_voltage_oop
    cmd_query: OUTR?2
    figure_axis: SR830_voltage_oop
    unit: V
  sweep_values: []
  write_cmds: []
VNA:
  measurements:
  - description: VNA_set_delaytime
    cmd_query: DEL {time};TYPE LIN
    figure_axis: none
    unit: t
  sweep_values: []
  write_cmds:
  - description: VNA_configuration
    cmd_set: ':DISP:WIND{channel}:ACT;

      :CALC{channel}:PAR:COUN {num_of_trace};

      :CALC{channel}:PAR{active_trace}:SEL;:CALC1:PAR{active_trace}:DEF {SXX};

      :CALC{channel}:FORM MLOG;'
    figure_axis: none
    unit: none
  - description: VNA_set_numofpoint
    cmd_set: :SENS{channel}:SWE:POIN {num_of_point};
    figure_axis: none
    unit: none
  - description: VNA_set_sweeptime
    cmd_set: SENS{channel}:SWE:TIME {t}
    figure_axis: none
    unit: t
